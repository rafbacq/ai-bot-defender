# Shared mirror target, included by every per-site server block so the mirror
# wiring stays DRY. The main `location /` issues `mirror /_mirror;` which
# replays the (body-less, GET) request here as an internal subrequest.
#
# Best-effort + non-blocking: short timeouts and proxy_next_upstream off mean a
# slow or down collector can never stall the real response (which nginx has
# already started returning to the client).
location = /_mirror {
    internal;
    set $collector collector;
    proxy_pass http://$collector:8000$request_uri;
    proxy_set_header Host $host;
    # Use the site's canonical configured hostname even when the request arrives
    # through its browser-friendly <site-id>.dukecodeplus.localhost alias.
    proxy_set_header X-Site $site_name;
    proxy_set_header X-Real-IP $remote_addr;
    # Client source TCP port -> collector -> all_visits.client_port. Lets the
    # crawler-graph layer join each request to its passively-captured TLS
    # fingerprint (tls_handshakes) by the exact (client_ip, client_port) 4-tuple.
    proxy_set_header X-Client-Port $remote_port;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 200ms;
    proxy_read_timeout 500ms;
    proxy_next_upstream off;
}
