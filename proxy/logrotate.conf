# Rotation policy for the reverse proxy's access logs (the nginx_logs volume,
# mounted at /var/log/nginx in the `logrotate` sidecar). Without this the JSON
# siteaccess + unmatched logs grow forever on a public deployment.
#
# copytruncate keeps nginx writing to the same fd (no signal needed from a
# separate container) and Promtail handles the truncation cleanly (it detects
# the size reset and re-reads from offset 0). A few lines can be lost in the
# copy->truncate window; that is acceptable here because the authoritative
# request record is logdb.all_visits (the mirror), not this file, and Promtail
# has usually shipped the tail already.
#
# Rotated names (*.log.1, *.log.2.gz, ...) deliberately do NOT match Promtail's
# /var/log/nginx-proxy/*.access.log glob, so rotation never double-ingests.
# Scoped to *.access.log: the volume also carries the stock image's
# access.log/error.log -> /dev/std{out,err} symlinks, which must not be touched.
/var/log/nginx/*.access.log {
    daily
    maxsize 100M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
