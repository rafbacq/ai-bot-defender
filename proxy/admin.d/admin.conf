# Control-center (admin) vhost — the ONLY non-honeypot vhost on this proxy.
# Lives in proxy/admin.d/ (its own directory mount, like conf.d/ — required so
# sed -i edits propagate into the container; see nginx.conf). Included from
# nginx.conf, not rendered by Ansible. scripts/set-public-host.sh rewrites the
# server_name lines when the public address changes; scripts/setup-letsencrypt.sh
# manages the ssl_certificate lines (adds them on first issuance).
#
# Security posture (deliberate, all load-bearing):
#   - HTTPS-only: the :80 block serves nothing but ACME challenges + a 301.
#     (Honeypot sites intentionally serve both schemes; the admin panel is the
#     opposite trade-off.)
#   - NO mirror include: admin traffic must never enter all_visits — it would
#     pollute the crawler research data and record admin session cookies into
#     the headers jsonb column.
#   - X-Forwarded-For / X-Real-IP are OVERWRITTEN with $remote_addr (the same
#     anti-spoof rule as the honeypot vhosts); the app keys its login rate
#     limits on X-Real-IP.
#   - limit_req: credential/code POSTs (login / signup / admin console / TOTP
#     enable+disable) are capped at 5/min/IP (auth_slow); everything else at
#     20 r/s (admin_general).
#     Zones are defined in nginx.conf at http{} scope.
#   - The app itself enforces sign-in (+ a TOTP challenge for enrolled users)
#     on every non-public route; this vhost is defense-in-depth around that.
#   - Grafana is view-only for anonymous users inside its private network, but
#     EVERY public /grafana/ request first passes auth_request against the
#     app's signed is_admin session. Grafana never joins the honeypot network.

# admin.d/*.conf is included at http{} scope, so this map can safely support
# Grafana Live WebSocket upgrades without touching proxy/nginx.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name admin.44.216.255.139.sslip.io;
    access_log /var/log/nginx/admin.access.log siteaccess;

    # ACME HTTP-01 must be reachable over plain HTTP for issuance/renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.44.216.255.139.sslip.io;
    access_log /var/log/nginx/admin.access.log siteaccess;

    # Trusted certificate (uncommented by scripts/setup-letsencrypt.sh once
    # issued; until then the self-signed wildcard from nginx.conf is inherited).
    ssl_certificate     /etc/letsencrypt/live/abd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abd/privkey.pem;

    # Browser hardening. `always` = also on error responses. HSTS is safe here
    # because this hostname is HTTPS-only by design (never set it on the
    # honeypot vhosts, which must keep serving plain HTTP to crawlers).
    #
    # The Crawler Analytics campaign graph is a same-origin iframe
    # (/logs -> /intel/graph.html), so DENY would block the application's own
    # graph. SAMEORIGIN plus CSP frame-ancestors keeps cross-origin framing
    # blocked while permitting that intentional embed.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy same-origin always;

    # Manual-evaluation spreadsheet uploads on /query are small; 25m is ample.
    client_max_body_size 25m;

    # Internal-only session decision used by both Grafana HTTP and WebSocket
    # requests. auth_request always makes a bodyless GET subrequest; it needs a
    # literal 204/401 response, never the app's normal login redirect.
    location = /_gfauth {
        internal;
        set $admin_upstream ai-bot-defender-app;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$admin_upstream:8000/admin/auth-check;
    }

    # Canonicalize the two admin entry points before the generic app proxy.
    location = /admin {
        return 302 /admin/approve;
    }
    location = /grafana {
        return 302 /grafana/;
    }

    # A failed auth subrequest returns visitors to the existing admin unlock
    # page. No add_header directives belong here or in the Grafana locations:
    # adding one would stop inheritance of the server-level security headers.
    location @gf_login {
        return 302 /admin/approve;
    }

    # Grafana Live uses a long-lived WebSocket under this more-specific path.
    location /grafana/api/live/ {
        auth_request /_gfauth;
        error_page 401 = @gf_login;
        limit_req zone=admin_general burst=100 nodelay;

        set $gf_upstream mon-grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_pass http://$gf_upstream:3000;
    }

    # Keep the original /grafana/... URI: serve_from_sub_path makes Grafana
    # strip its own prefix. Omitting a proxy_pass URI is deliberate.
    location /grafana/ {
        auth_request /_gfauth;
        error_page 401 = @gf_login;
        limit_req zone=admin_general burst=100 nodelay;

        set $gf_upstream mon-grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://$gf_upstream:3000;
    }

    # Credential endpoints: POSTs capped at 5/min/IP (GET page loads exempt via
    # the $auth_limit_key map). 429 after the burst is exhausted.
    location = /login {
        limit_req zone=auth_slow burst=5 nodelay;
        set $admin_upstream ai-bot-defender-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$admin_upstream:8000$request_uri;
    }
    location = /login/2fa {
        limit_req zone=auth_slow burst=5 nodelay;
        set $admin_upstream ai-bot-defender-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$admin_upstream:8000$request_uri;
    }
    location = /account/2fa/enable {
        limit_req zone=auth_slow burst=5 nodelay;
        set $admin_upstream ai-bot-defender-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$admin_upstream:8000$request_uri;
    }
    location = /account/2fa/disable {
        limit_req zone=auth_slow burst=5 nodelay;
        set $admin_upstream ai-bot-defender-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$admin_upstream:8000$request_uri;
    }
    location = /signup {
        limit_req zone=auth_slow burst=5 nodelay;
        set $admin_upstream ai-bot-defender-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$admin_upstream:8000$request_uri;
    }
    location = /admin/login {
        limit_req zone=auth_slow burst=5 nodelay;
        set $admin_upstream ai-bot-defender-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$admin_upstream:8000$request_uri;
    }

    location / {
        limit_req zone=admin_general burst=40 nodelay;
        # Resolve at request time (Docker DNS + variable) so nginx starts and
        # reloads cleanly even when the app container is momentarily down.
        set $admin_upstream ai-bot-defender-app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Site deploys (POST /sites/deploy) run Ansible synchronously and can
        # take a couple of minutes on a cold image build.
        proxy_read_timeout 600s;
        proxy_pass http://$admin_upstream:8000$request_uri;
    }
}
