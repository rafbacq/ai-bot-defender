user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    # Docker embedded DNS. Combined with a variable in proxy_pass (see the
    # per-site server blocks), this lets `nginx -s reload` succeed even when a
    # backend container is momentarily down, because upstream names are only
    # resolved at request time, not at config-load time.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- TLS (HTTPS) -------------------------------------------------------
    # One self-signed wildcard cert (written by the certgen init container into
    # the mounted proxy/certs/) serves EVERY site: site hostnames are subdomains
    # of the base domains, so *.dukecodeplus.example / *.dukecodeplus.localhost
    # covers all of them. Set at http scope so every server block below -- the
    # catch-all and each per-site block -- inherits it. nginx selects this cert
    # by TLS SNI during the handshake, then routes the decrypted request by Host
    # header: standard name-based virtual hosting, now over HTTPS.
    ssl_certificate     /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    # HTTP/2 (negotiated over TLS via ALPN) -- what a modern site serves.
    http2 on;

    # One JSON line per request -> central access log file (nginx_logs volume).
    # `scheme` records whether the request arrived over http or https, so the
    # access log shows which crawlers used TLS vs plain HTTP.
    log_format siteaccess escape=json
      '{'
        '"time":"$time_iso8601",'
        '"site":"$host",'
        '"scheme":"$scheme",'
        '"client_ip":"$remote_addr",'
        '"client_port":"$remote_port",'
        '"xff":"$http_x_forwarded_for",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"user_agent":"$http_user_agent",'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr"'
      '}';
    access_log /var/log/nginx/dukecodeplus.access.log siteaccess;

    # ----------------------------------------------------------------------
    # Default catch-all server (load-bearing for per-site canary attribution).
    #
    # Any request whose Host header does NOT match a configured site -- raw-IP
    # scans, bogus/spoofed Host values, or requests with no Host header at all
    # -- lands here instead of silently falling through to whichever real site
    # sorts first in conf.d. That fall-through was polluting a real site's
    # canary attribution and visit log with scan noise.
    #
    # Two guarantees follow from this block existing:
    #   1. Unmatched/junk traffic never reaches a real site's Flask backend, so
    #      no canary tokens are ever assigned to a raw-IP scanner.
    #   2. Every request that DOES reach a per-site server block now has a Host
    #      that matched that site's server_name -- so the per-site `$host` (sent
    #      on to the collector as X-Site) can never be an arbitrary client value.
    #      The central all_visits.site column is therefore trustworthy.
    #
    # We neither proxy to a backend nor mirror to the collector here: unmatched
    # traffic stays out of all_visits entirely. Scans are still recorded for
    # research -- in their own access log -- but never attributed to a site.
    # `return 444` closes the connection with no response body (minimal
    # disclosure to scanners); switch to `return 404;` to answer them instead.
    #
    # It is default_server on BOTH ports, so unmatched HTTPS connections (an
    # unknown/spoofed SNI or a raw-IP TLS probe) are caught too. The TLS
    # handshake still completes using the inherited wildcard cert before the 444,
    # which is unavoidable for HTTPS -- but no backend is reached and nothing is
    # mirrored, so scanners get no canary and never enter all_visits.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        access_log /var/log/nginx/unmatched.access.log siteaccess;
        return 444;
    }

    # Per-site server blocks, rendered by Ansible (one file per site_id). These
    # use plain `listen 80;` / `listen 443 ssl;` (never default_server), so the
    # block above stays the sole catch-all and host-based routing stays
    # deterministic.
    include /etc/nginx/conf.d/*.conf;
}
