---
- name: Ensure varLists directory exists
  ansible.builtin.file:
    path: "{{ website_dir }}/varLists"
    state: directory
    mode: "0755"

- name: Render canary token list for scraper{{ scraper_version }}
  ansible.builtin.template:
    src: canary_vars.txt.j2
    dest: "{{ website_dir }}/varLists/scraper{{ scraper_version }}.txt"
    mode: "0644"

- name: Ensure an HTML template exists for scraper{{ scraper_version }}
  ansible.builtin.copy:
    src: "{{ website_dir }}/templates/scraper1.html"
    dest: "{{ website_dir }}/templates/scraper{{ scraper_version }}.html"
    mode: "0644"
    force: false
  when: scraper_version | int != 1

- name: Ensure per-site directory exists
  ansible.builtin.file:
    path: "{{ website_dir }}/sites/{{ site_id }}"
    state: directory
    mode: "0755"

- name: Render per-site docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ website_dir }}/sites/{{ site_id }}/docker-compose.yml"
    mode: "0644"

- name: Ensure server.py reads SCRAPER_VERSION from env
  ansible.builtin.replace:
    path: "{{ website_dir }}/server.py"
    regexp: '^SCRAPER_VERSION = \d+\s*$'
    replace: 'SCRAPER_VERSION = int(os.environ.get("SCRAPER_VERSION", 1))'

# Public nginx and Prometheus artifacts are intentionally absent here.  The
# publish role writes them only after the deploy role confirms the web service
# is running, so a cancelled configure/deploy cannot expose a dead upstream.
