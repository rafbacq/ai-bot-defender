---
# Prometheus has no --web.enable-lifecycle flag: SIGHUP reloads its config and
# rule-file globs without exposing the lifecycle/quit API on monitoring_bridge.
# A stopped monitoring stack is allowed—the files load on its next start—but a
# running Prometheus must acknowledge HUP or publication rolls back.
- name: Inspect Prometheus before rule reload
  ansible.builtin.command: >-
    docker ps --quiet --filter name=^/{{ monitoring.prometheus_container }}$
  register: prometheus_for_rule_reload
  changed_when: false
  listen: Reload prometheus rules

- name: Reload prometheus rules
  ansible.builtin.command: >-
    docker kill --signal=HUP {{ monitoring.prometheus_container }}
  changed_when: true
  when: prometheus_for_rule_reload.stdout | trim | length > 0
  listen: Reload prometheus rules
