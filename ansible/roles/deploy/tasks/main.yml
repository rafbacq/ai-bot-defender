---
# The site stack and the reverse-proxy stack share an EXTERNAL docker network
# (proxy_net) so nginx can reach this site's web container by alias. Compose
# refuses to start a stack that references a missing external network, so make
# sure it exists before `up`. This lets the documented direct path
# (`cd ansible && ansible-playbook site.yml -e site_id=<id>`) work on a fresh
# machine without first running a `make` target -- the Makefile's `ensure-net`
# only covers the make-driven flow. Idempotent: an existing network is a no-op,
# and any other failure (docker missing / daemon down) still surfaces.
- name: Ensure the shared external proxy_net network exists
  ansible.builtin.command:
    cmd: docker network create proxy_net
  register: proxy_net_create
  changed_when: proxy_net_create.rc == 0
  failed_when:
    - proxy_net_create.rc != 0
    - "'already exists' not in proxy_net_create.stderr"

# Postgres bakes POSTGRES_USER/PASSWORD/DB into its data dir on FIRST init only.
# Changing DB credentials on an existing site leaves the old pgdata volume in place,
# so the healthcheck (new creds) fails and `up -d` errors out. When the operator
# explicitly requests it (reset_db=true), tear the stack down and drop the volume
# first so Postgres re-initializes with the new credentials. This WIPES stored data.
- name: Tear down stack and remove DB volume when reset_db is requested
  ansible.builtin.command:
    cmd: docker compose down -v
    chdir: "{{ website_dir }}/sites/{{ site_id }}"
  when: reset_db | default(false) | bool
  changed_when: true
  failed_when: false

- name: Build and (re)start containers for site {{ site_id }}
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ website_dir }}/sites/{{ site_id }}"
  register: compose_up
  changed_when: "'Creating' in compose_up.stderr or 'Recreate' in compose_up.stderr or 'Started' in compose_up.stderr or 'Building' in compose_up.stderr"

- name: Show running containers for site {{ site_id }}
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ website_dir }}/sites/{{ site_id }}"
  register: compose_ps
  changed_when: false

- name: Print service URL
  ansible.builtin.debug:
    msg: "Site {{ site_id }} is up through the reverse proxy: https://{{ proxy.server_name | default(site_id ~ '.' ~ proxy.base_domain) }}/  (local alias http://{{ site_id }}.{{ proxy.local_base_domain }}/, direct debug port={{ website.port }}, genmode={{ website.genmode }}, scraper_version={{ scraper_version }}, db_port={{ database.host_port }})"
