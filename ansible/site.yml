---
- name: Reserve the cross-process publication transaction
  hosts: localhost
  gather_facts: false

  vars:
    publication_lock_dir: "{{ playbook_dir }}/../configs/.publication.lock"
    publication_lock_is_nested: >-
      {{ lookup('ansible.builtin.env', 'ABD_PUBLICATION_LOCK_HELD') == '1' }}

  tasks:
    - name: Require site_id before reserving publication
      ansible.builtin.assert:
        that:
          - site_id is defined
          - site_id is match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
          - site_id != 'admin'
        fail_msg: >-
          Pass a lowercase DNS-label-safe site via -e site_id=<id> (e.g.
          site-001); use 1-63 letters/digits with non-edge hyphens only. The
          id 'admin' is reserved for the control plane.

    # This is a separate first play so the lock exists before the deployment
    # play reloads global/per-site YAML or scans routes and ports. A competing
    # public-host migration can therefore never slip between inventory reads
    # and publication.
    - name: Acquire cross-process publication lock
      ansible.builtin.command:
        argv:
          - mkdir
          - "{{ publication_lock_dir }}"
      register: publication_lock_acquire
      changed_when: publication_lock_acquire.rc == 0
      failed_when: false
      when:
        - not (publication_lock_is_nested | bool)
        - not ansible_check_mode

    - name: Require exclusive publication ownership
      ansible.builtin.assert:
        that:
          - publication_lock_acquire.rc | default(0) == 0
        fail_msg: >-
          Another site deployment, public-host migration, scheduled TLS
          renewal, or certificate publication owns {{ publication_lock_dir }}.
          Wait for it to finish. If no such process exists, inspect the retained
          lock and rollback artifacts before removing it manually.
      when:
        - not (publication_lock_is_nested | bool)
        - not ansible_check_mode

    - name: Record publication lock owner
      ansible.builtin.copy:
        content: "site_id={{ site_id }}\n"
        dest: "{{ publication_lock_dir }}/owner"
        mode: "0644"
      when:
        - not (publication_lock_is_nested | bool)
        - not ansible_check_mode
        - publication_lock_acquire.rc | default(1) == 0

- name: Configure and deploy a single AI Bot Defender site
  hosts: localhost
  gather_facts: true

  vars:
    site_config_path: "{{ project_root }}/configs/sites/{{ site_id | default('') }}.yaml"
    publication_lock_dir: "{{ project_root }}/configs/.publication.lock"
    publication_lock_is_nested: >-
      {{ lookup('ansible.builtin.env', 'ABD_PUBLICATION_LOCK_HELD') == '1' }}

  pre_tasks:
    - name: Validate deployment inputs under publication lock
      block:
        - name: Run locked deployment validation
          ansible.builtin.include_tasks: tasks/validate-site.yml
      rescue:
        - name: Release direct-play lock after validation failure
          ansible.builtin.file:
            path: "{{ publication_lock_dir }}"
            state: absent
          when:
            - not (publication_lock_is_nested | bool)
            - not ansible_check_mode
            - publication_lock_acquire.rc | default(1) == 0

        - name: Fail after releasing invalid deployment reservation
          ansible.builtin.fail:
            msg: >-
              Deployment validation failed for {{ site_id }}:
              {{ ansible_failed_result.msg | default('unknown validation error') }}

  tasks:
    - name: Configure, deploy, and publish under one cross-process lock
      block:
        - name: Run local prerequisites
          ansible.builtin.include_role:
            name: prereqs
          when: ansible_facts['os_family'] == 'Darwin'

        - name: Render site configuration
          ansible.builtin.include_role:
            name: configure

        - name: Start and health-gate site containers
          ansible.builtin.include_role:
            name: deploy
          # Route-only certificate/hostname maintenance must not start
          # YAML-only sites or recreate their containers.
          when: not (render_only | default(false) | bool)

        # Publication is last: failed/cancelled startup never creates a public
        # route or permanent missing-container alert.
        - name: Publish route, TLS, and monitoring state
          ansible.builtin.include_role:
            name: publish
      always:
        - name: Release completed direct-play publication lock
          ansible.builtin.file:
            path: "{{ publication_lock_dir }}"
            state: absent
          when:
            - not (publication_lock_is_nested | bool)
            - not ansible_check_mode
            - publication_lock_acquire.rc | default(1) == 0
            - publication_rollback_failures | default([]) | length == 0

        - name: Report retained lock after incomplete rollback
          ansible.builtin.debug:
            msg: >-
              Publication rollback was incomplete. The safety lock remains at
              {{ publication_lock_dir }}; resolve the named rollback failures
              before removing it manually.
          when:
            - not (publication_lock_is_nested | bool)
            - not ansible_check_mode
            - publication_rollback_failures | default([]) | length > 0
