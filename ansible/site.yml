---
- name: Configure and deploy a single AI Bot Defender site
  hosts: localhost
  gather_facts: true

  vars:
    site_config_path: "{{ project_root }}/configs/sites/{{ site_id | default('') }}.yaml"

  pre_tasks:
    - name: Require site_id
      ansible.builtin.assert:
        that:
          - site_id is defined
          - site_id | length > 0
        fail_msg: "Pass the site to deploy via -e site_id=<id> (e.g. site-001)."

    - name: Load per-site overrides from {{ site_config_path }}
      ansible.builtin.include_vars:
        file: "{{ site_config_path }}"
        name: site_cfg

    - name: Merge site overrides over defaults
      ansible.builtin.set_fact:
        scraper_version: "{{ site_cfg.scraper_version | default(scraper_version) | int }}"
        website: "{{ website | combine(site_cfg.website | default({})) }}"
        database: "{{ database | combine(site_cfg.database | default({})) }}"
        proxy: "{{ proxy | combine(site_cfg.proxy | default({})) }}"
        # Generator-authored flavors ship their own category-typed varList; the
        # app embeds it per site (configs/sites/<id>.yaml) so the rendered
        # varLists/scraper<N>.txt matches the template. Absent, the global
        # canary_tokens from all.yml apply unchanged.
        canary_tokens: "{{ site_cfg.canary_tokens | default(canary_tokens) }}"

    - name: Coerce genmode to bool
      ansible.builtin.set_fact:
        website: "{{ website | combine({'genmode': (website.genmode | string | lower == 'true')}) }}"

    - name: Sanity-check canary_tokens length
      ansible.builtin.assert:
        that: canary_tokens | length >= 10
        fail_msg: "canary_tokens must define at least 10 expressions (one per var1..var10)."

    - name: List other site config files
      ansible.builtin.find:
        paths: "{{ project_root }}/configs/sites"
        patterns: "*.yaml"
        excludes: "{{ site_id }}.yaml"
      register: other_site_files

    - name: Slurp other site configs
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ other_site_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: other_sites_slurp

    - name: Compute ports already claimed by other sites
      ansible.builtin.set_fact:
        used_web_ports: >-
          {{
            other_sites_slurp.results
            | map(attribute='content')
            | map('b64decode')
            | map('from_yaml')
            | map(attribute='website', default={})
            | map(attribute='port', default=None)
            | reject('none')
            | map('int')
            | list
          }}
        used_db_ports: >-
          {{
            other_sites_slurp.results
            | map(attribute='content')
            | map('b64decode')
            | map('from_yaml')
            | map(attribute='database', default={})
            | map(attribute='host_port', default=None)
            | reject('none')
            | map('int')
            | list
          }}

    - name: Validate website.port is not used by another site
      ansible.builtin.assert:
        that: (website.port | int) not in used_web_ports
        fail_msg: >-
          website.port={{ website.port }} collides with another site config.
          Already claimed: {{ used_web_ports }}. Pick a different port in the UI.

    - name: Validate database.host_port is not used by another site
      ansible.builtin.assert:
        that: (database.host_port | int) not in used_db_ports
        fail_msg: >-
          database.host_port={{ database.host_port }} collides with another site config.
          Already claimed: {{ used_db_ports }}. Pick a different port in the UI.
      # An external database (database.host set, e.g. an AWS RDS endpoint) renders
      # no db container and binds no host port, so there is nothing to collide.
      when: database.host is not defined

  roles:
    - role: prereqs
      when: ansible_facts['os_family'] == 'Darwin'
    - configure
    - deploy
