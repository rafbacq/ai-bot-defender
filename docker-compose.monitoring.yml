# Self-hosted observability stack for AI Bot Defender — the open-source
# replacement for the original AWS plan's managed services:
#   - prometheus    : metrics TSDB (replaces Amazon Managed Prometheus + the
#                     CloudWatch metric/alarm role)
#   - node-exporter : host CPU / memory / disk / network metrics
#   - cadvisor      : per-container CPU / memory / network / IO metrics
#   - loki          : log aggregation, filesystem-backed on the instance disk
#                     (replaces the S3-backed Loki plan; same searchable logs)
#   - promtail      : ships every Docker container's stdout/stderr PLUS the
#                     reverse proxy's JSON access logs (the honeypot request
#                     stream + unmatched scanner noise) into loki
#   - blackbox      : HTTP/TLS/SAN checks against every rendered site vhost
#   - alertmanager  : groups + silences alerts (local-only receiver by default)
#   - grafana       : dashboards + alerting over both datasources (replaces
#                     Amazon Managed Grafana)
#
# Security posture (load-bearing): every published port here remains bound to
# 127.0.0.1 ONLY. Prometheus, Loki, and Grafana additionally join the private
# monitoring_bridge so the app can read health data and nginx can expose
# Grafana only after its per-request admin-session gate. Honeypot sites never
# join that bridge; monitoring never joins the honeypot-routing network; and
# this stack still cannot sit in the crawler request path. The nginx_logs mount
# remains read-only.
#
# GRAFANA_ADMIN_PASSWORD is read from the git-ignored project-root .env (the
# same file the app's key manager writes), substituted by compose on `up`.
#
# Bring up with:  docker compose -f docker-compose.monitoring.yml up -d
# (the proxy stack must be up once first so the external nginx_logs volume exists)
name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mon-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/alerts.d:/etc/prometheus/alerts.d:ro
      - ./monitoring/targets.d:/etc/prometheus/targets.d:ro
      - prom_data:/prometheus
    networks: [default, monitoring_bridge]
    restart: unless-stopped

  # Shares nginx's network namespace so probes can connect to 127.0.0.1 while
  # supplying each canonical vhost as Host + TLS SNI. This keeps synthetic TLS
  # off Zeek's non-loopback capture and exposes :9115 only on nginx's private
  # Docker networks, never on a host port. The proxy stack must already be up.
  blackbox:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: mon-blackbox
    network_mode: "container:proxy-nginx"
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    restart: unless-stopped

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.32.1
    container_name: mon-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      # Override with ALERTMANAGER_CONFIG=<git-ignored path> only after adding
      # a real receiver. The committed default intentionally sends nowhere.
      - ${ALERTMANAGER_CONFIG:-./monitoring/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [default, monitoring_bridge]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: mon-node-exporter
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  cadvisor:
    # Needs a recent release for this box's Docker 29 daemon: v0.49's docker
    # client speaks API 1.41 (daemon minimum is 1.44) so its docker factory
    # can't even register, and every release through v0.52 hard-requires the
    # classic image/<driver>/layerdb on-disk layout that Docker 29's containerd
    # image store no longer has ("failed to identify the read-write layer ID")
    # -- either way the per-container `name` label is silently lost, blanking
    # the per-container dashboard panels and container-down alerts. v0.56+
    # migrated to the modern moby client; distribution also moved from gcr.io
    # to ghcr.io.
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: mon-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: mon-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [default, monitoring_bridge]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    container_name: mon-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Docker service-discovery + each container's json log files.
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # The proxy stack's nginx access logs (JSON siteaccess + unmatched).
      - nginx_logs:/var/log/nginx-proxy:ro
      - promtail_positions:/positions
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mon-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://admin.${PROXY_BASE_DOMAIN:-localhost}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - alertmanager
    networks: [default, monitoring_bridge]
    restart: unless-stopped

volumes:
  prom_data:
  loki_data:
  grafana_data:
  promtail_positions:
  alertmanager_data:
  # The proxy stack's nginx log volume (created by docker-compose.proxy.yml,
  # compose project "proxy"). External so this stack only ever reads it.
  nginx_logs:
    external: true
    name: proxy_nginx_logs

networks:
  monitoring_bridge:
    external: true
