# Blackbox Exporter modules for synthetic honeypot-vhost checks.
#
# Targets connect to nginx over loopback and pass the canonical hostname via
# Blackbox Exporter's `hostname` parameter (HTTP Host + TLS SNI).  Both modules
# require the dedicated health endpoint's exact 204 response; redirects, a
# catch-all response, an invalid certificate, and a dead upstream all fail.
modules:
  abd_http:
    prober: http
    timeout: 8s
    http:
      method: GET
      valid_status_codes: [204]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: AI-Bot-Defender-Monitor/1.0

  abd_https:
    prober: http
    timeout: 8s
    http:
      method: GET
      valid_status_codes: [204]
      follow_redirects: false
      fail_if_not_ssl: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      headers:
        User-Agent: AI-Bot-Defender-Monitor/1.0
      tls_config:
        insecure_skip_verify: false
        min_version: TLS12
