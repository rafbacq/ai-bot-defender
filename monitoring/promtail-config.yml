# Promtail: ships logs into Loki.
#   1. Every Docker container's stdout/stderr on the box (discovered live via
#      the Docker socket), labeled by container name + compose project — this
#      covers the app, the proxy services, every per-site honeypot stack, and
#      the monitoring stack itself.
#   2. The reverse proxy's nginx access logs read from the proxy stack's
#      nginx_logs volume: the JSON `siteaccess` log (all honeypot traffic,
#      per-site) and unmatched.access.log (raw-IP / bogus-Host scanner noise).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project

  - job_name: nginx-access
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx_access
          __path__: /var/log/nginx-proxy/*.access.log
