# Safe default: Alertmanager groups, tracks, and silences alerts locally, but
# deliberately sends nothing off-host until an operator supplies a git-ignored
# configuration with a real receiver.  Never commit notification credentials.
global:
  resolve_timeout: 5m

route:
  receiver: local-only
  group_by: [alertname, site, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-only
