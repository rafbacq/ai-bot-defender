# Load every dashboard JSON in /var/lib/grafana/dashboards (mounted from
# monitoring/grafana/dashboards/).
apiVersion: 1

providers:
  - name: ai-bot-defender
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
