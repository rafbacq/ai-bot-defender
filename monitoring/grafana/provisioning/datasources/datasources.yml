# Grafana datasources, provisioned at container start. Fixed uids so the
# provisioned dashboard JSON can reference them stably.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  # Prometheus-managed alerts remain read-only, while this datasource lets an
  # administrator inspect Alertmanager state and manage silences in Grafana.
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
